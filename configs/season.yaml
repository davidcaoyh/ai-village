# A season is the shared goal. Kept separate from the cast so the same four
# models can be rerun on a new goal, or a new cast on the same goal.

season_id: s01-causal-brief
title: "Causal claim briefs"

# One goal, run again and again. Each time the village votes it done (D36) the
# orchestrator starts the next round on a fresh file - brief.md, brief-2.md,
# brief-3.md - so a session that finishes early keeps producing instead of
# spending its remaining turns agreeing it is finished. {file} and {round} are
# filled in per round. The session now ends on the turn cap or the spend cap,
# which is the shape the real AI Village runs: time-boxed, not task-boxed.
repeat: true
artifact_stem: brief
goal: >
  Round {round}. As a team, produce a short public brief in {file} answering a
  social-science causal question of your choosing: does X cause Y?

  It must be a question no brief has answered before, in this session or in any
  earlier one. These are already taken, so pick something else:

  {answered}

  read_file shows what is in a brief if you want to see how one was handled.

constraints:
  - Do not try to contact real people.
  - Do not claim you have done something unless it is in the log.
  - 'Every brief has exactly these sections, in this order: "## Question",
    "## Answer", "## Evidence", "## Correlation vs causation",
    "## Confounders we cannot rule out", "## Sources".'
  - Claim a section in chat, then edit_file that one section. Read the file
    before you touch it. Two villagers editing the same section overwrite each
    other, so say which one you are taking.
  - Cite real sources with urls. Distinguish correlation from causation. Name
    the confounders you cannot rule out rather than hiding them.
  - Choose a question from economics, education, labour, development or public
    policy. Do not write about suicide, self-harm, mental-health treatment,
    medical or clinical questions, or an active political controversy. If a
    question would need a clinician or a lawyer to answer responsibly, pick a
    different one.
  - In Sources, list only urls fetch_url returned or resolve_doi confirmed this
    session. Mark anything else "(unverified)".
session:
  turns_per_session: 120
  seconds_between_turns: 2
  context_window_events: 30
  compaction_every_turns: 8
  max_steps_per_turn: 8
  max_idle_rounds: 3
