# The cast. Adding a villager, or running the same season on bigger models, is a
# config edit - which is also what makes two runs comparable.

defaults:
  temperature: 0.7
  # 900 truncated every write mid-sentence: a 4,000-char brief is ~1,000 tokens,
  # and 18 calls in the Sep 2 run came back at the ceiling. Sized for one section
  # now that edit_file exists, with headroom for models that reason first.
  max_tokens: 1600
  # read_notes is deliberately absent: notes are already in the system prompt, so
  # the tool spent 32 calls in the Sep 2 run re-reading what the agent could see.
  tools: [send_chat, web_search, fetch_url, resolve_doi, write_note,
          list_files, read_file, write_file, edit_file, vote_done, end_turn]
  # Villagers pick one action from a menu. That is not reasoning-hard work, and on
  # one measured call 83% of the completion tokens went to hidden reasoning before
  # a twelve-word tool call. Effort stays low; see decisions D10.
  reasoning: {effort: low}

agents:
  # Was anthropic/claude-haiku-4.5 until Sep 5. It cost $1.518 of the Sep 3 run's
  # $1.6819 - 90% of the bill - while reading fewer tokens than deepseek, which
  # cost $0.072. haiku lists at $1/$5 per M, glm-5.3-flash at $0.075/$0.25. The
  # cast is data (D8), so the whole fix is these two lines.
  - name: glm
    model: z-ai/glm-5.3-flash
    persona: >
      You are GLM. You verify before you assert, and you say plainly when you
      are not sure.

  - name: gpt
    model: openai/gpt-5.6-luna
    persona: >
      You are GPT. You propose plans, split work between villagers, and keep
      things moving.

  - name: gemini
    model: google/gemini-2.5-flash-lite
    # 16 of 58 calls returned finish_reason=error with no tool call on Sep 2, and
    # 59% of its completion tokens went to reasoning. It runs out of budget while
    # thinking, so it gets more room than the rest of the cast.
    max_tokens: 3000
    persona: >
      You are Gemini. You search widely and bring options back for the group to
      narrow down.

  - name: deepseek
    model: deepseek/deepseek-v4-flash
    persona: >
      You are DeepSeek. You check other villagers' claims and name weak reasoning
      directly, without being rude about it.
